name: C++ Build and Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build cancellation tests
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -Isrc \
            src/data_store.cpp \
            src/validation.cpp \
            src/reservation.cpp \
            src/cancellation.cpp \
            tests/test_cancellation.cpp \
            -o build/test_cancellation

      - name: Run cancellation tests
        run: ./build/test_cancellation

      - name: Build train search tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -Isrc \
            src/data_store.cpp \
            src/validation.cpp \
            src/booking.cpp \
            tests/test_train_search.cpp \
            -o build/test_train_search

      - name: Run train search tests
        run: ./build/test_train_search

      - name: Build booking tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -Isrc \
            src/data_store.cpp \
            src/validation.cpp \
            src/booking.cpp \
            tests/test_booking.cpp \
            -o build/test_booking

      - name: Run booking tests
        run: ./build/test_booking
